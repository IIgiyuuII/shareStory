<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Открыть редактор историй</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init({ defaults: { displaySize: 45 } });</script>

  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f0f2f5; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 { color: #0088cc; margin-bottom: 40px; }
    button {
      padding: 20px 80px;
      font-size: 1.4em;
      margin: 40px 0;
      border: none;
      border-radius: 20px;
      background: #0088cc;
      color: white;
      cursor: pointer;
    }
    #status { 
      font-size: 1.2em; 
      margin: 30px; 
      color: #333; 
      white-space: pre-wrap; 
      word-break: break-all; 
      background: #fff; 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid #ccc; 
      max-width: 90%;
    }
  </style>
</head>
<body>
  <h1>Открыть редактор историй</h1>
  <button id="shareButton">Открыть камеру / галерею для истории</button>
  <div id="status">Ждём нажатия... (смотри Eruda Console после клика)</div>

  <script>
    console.log('[START] Скрипт загружен');

    function init() {
      const tg = Telegram.WebApp;
      tg.ready();
      tg.expand();
      console.log('[INIT] Telegram ready + expand');

      const status = document.getElementById('status');
      const btn = document.getElementById('shareButton');

      if (!btn) {
        status.textContent = 'Ошибка: кнопка не найдена';
        console.error('Кнопка не найдена');
        return;
      }

      console.log('[INIT] Кнопка найдена');

      btn.addEventListener('click', () => {
        console.log('[CLICK] Кнопка нажата');
        status.textContent = 'Открываем редактор историй без медиа...';

        if (tg.platform.includes('desktop') || tg.platform === 'tdesktop') {
          status.textContent += '\nПК/десктоп: функция не поддерживается';
          console.warn('ПК платформа');
          return;
        }

        if (typeof tg.shareToStory !== 'function') {
          status.textContent += '\nМетод shareToStory недоступен в твоей версии Telegram';
          console.warn('Нет shareToStory');
          return;
        }

        console.log('[CALL] Вызываем shareToStory с пустым media_url');

        try {
          tg.shareToStory('', {  // Пустой media_url — должен открыть камеру/галерею
            text: 'Пустая история для теста (можно добавить фото/видео)'
          });

          status.textContent += '\nВызов прошёл → жди камеру или галерею (1–5 сек)\nЕсли ничего не открылось — обнови Telegram до последней версии';
          console.log('[SUCCESS] shareToStory вызван без исключения');
        } catch (err) {
          status.textContent += '\nОшибка: ' + (err.message || 'неизвестно');
          console.error('[ERROR] shareToStory:', err);
        }
      });

      status.textContent = 'Нажми кнопку выше\n(открой Eruda → Console для логов)';
      console.log('[INIT] Всё настроено');
    }

    init();
  </script>
</body>
</html>
