<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f0f2f5; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1, h2 { color: #0088cc; margin-bottom: 20px; }
    button {
      padding: 16px 48px;
      font-size: 1.2em;
      margin: 20px 0;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .share-btn { background: #0088cc; color: white; }
    .close-btn { background: #666; color: white; }
    #status { font-size: 1.1em; margin-top: 20px; color: #333; max-width: 90%; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Готов поделиться</h1>
  <p>Нажми кнопку ниже</p>
  <button class="share-btn" id="shareButton">Поделиться в историю</button>
  <div id="status">Нажми кнопку, чтобы начать</div>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();

    const status = document.getElementById('status');
    const shareButton = document.getElementById('shareButton');

    const platform = tg.platform || 'unknown';
    const user = tg.initDataUnsafe?.user || {};
    const hasPremium = user.is_premium === true;

    // Показываем базовую инфу для отладки
    status.innerHTML = `Платформа: ${platform}<br>Premium: ${hasPremium ? 'да' : 'нет / не видно'}`;

    if (platform.includes('desktop') || platform === 'tdesktop' || platform === 'macos') {
      status.innerHTML += '<br><br><strong style="color:#e74c3c">Истории не поддерживаются на ПК — открой на телефоне</strong>';
      return;
    }

    shareButton.addEventListener('click', () => {
      shareButton.disabled = true;
      status.innerHTML = 'Попытка открыть редактор...\n(это может занять 1–3 секунды)';

      const digits = Math.floor(1000000000000000 + Math.random() * 9000000000000000).toString();

      if (!hasPremium) {
        status.innerHTML += '\nНет Premium → скачиваю txt';
        const blob = new Blob([digits], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'random_16_digits.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        status.innerHTML += '\nФайл скачан!';
        shareButton.disabled = false;
        return;
      }

      if (typeof tg.shareToStory !== 'function') {
        status.innerHTML += '\nМетод shareToStory недоступен в твоей версии Telegram';
        shareButton.disabled = false;
        return;
      }

      try {
        // Более надёжная картинка (placeholder, вертикальная, стабильная)
        tg.shareToStory('https://images.unsplash.com/photo-1557683316-973673baf926?w=720&h=1280&fit=crop', {
          text: `Тестовые 16 цифр:\n${digits}\nСгенерировано в мини-аппе!`
        });

        status.innerHTML += '\nВызов shareToStory прошёл без ошибок → редактор должен открыться поверх.\nЕсли ничего не видно:\n• Подожди 3–5 сек\n• Обнови Telegram\n• Перезапусти мини-апп полностью (закрой TG и открой заново)';
      } catch (err) {
        status.innerHTML += `\nОшибка: ${err.message || 'неизвестная ошибка при вызове'}`;
      }

      // Кнопку возвращаем через 5 сек, если ничего не произошло
      setTimeout(() => { shareButton.disabled = false; }, 5000);
    });
  </script>
</body>
</html>
