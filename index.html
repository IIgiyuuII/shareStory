<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px; 
      background: #f0f2f5; 
      margin: 0;
    }
    h1, h2 { color: #0088cc; }
    .message { font-size: 1.2em; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Подготовка...</h1>
  <div class="message" id="status">Проверяем...</div>

  <script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const status = document.getElementById('status');

  let debug = `
Версия WebApp: ${tg.version || 'неизвестно'}
Платформа: ${tg.platform || 'неизвестно'}
initDataUnsafe существует? ${!!tg.initDataUnsafe}
user: ${tg.initDataUnsafe?.user ? JSON.stringify(tg.initDataUnsafe.user, null, 2) : 'ОТСУТСТВУЕТ'}
is_premium: ${tg.initDataUnsafe?.user?.is_premium ?? 'нет данных'}
shareToStory существует? ${typeof tg.shareToStory === 'function' ? 'ДА' : 'НЕТ'}
  `;

  status.innerHTML = `<pre style="text-align:left; white-space:pre-wrap; font-size:0.95em; background:#fff; padding:15px; border:1px solid #ccc; border-radius:8px;">${debug}</pre>`;

  if (!tg.initDataUnsafe?.user) {
    status.innerHTML += '<p style="color:red; margin-top:20px;">→ Мини-апп открыт НЕ внутри Telegram. Открой через https://t.me/твойбот/имяаппа</p>';
  } else if (tg.initDataUnsafe.user.is_premium && typeof tg.shareToStory === 'function') {
    try {
      tg.shareToStory('https://picsum.photos/720/1280', {
        text: 'Тест: должно открыться редактор историй!'
      });
      status.innerHTML += '<p style="color:green; margin-top:20px;">shareToStory вызван → редактор должен появиться поверх!</p>';
    } catch(e) {
      status.innerHTML += `<p style="color:red;">Ошибка: ${e.message}</p>`;
    }
  } else {
    status.innerHTML += '<p>Нет Premium или метод недоступен → тест shareToStory пропущен</p>';
  }
</script>
</body>
</html>
