<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Eruda для отладки (можно удалить потом) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 { color: #0088cc; margin-bottom: 30px; }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-bottom: 40px;
    }
    button {
      padding: 16px 60px;
      font-size: 1.3em;
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #006699; }
    #status {
      margin-top: 30px;
      font-size: 1.1em;
      color: #555;
      max-width: 90%;
    }
  </style>
</head>
<body>

  <h1>Поделиться в историю</h1>

  <!-- Показываем твою картинку из репозитория -->
  <img src="Screenshot_10.jpg" alt="Твоя картинка для истории">

  <button id="shareButton">Поделиться в историю</button>

  <div id="status">Нажмите кнопку выше</div>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand(); // Разворачиваем мини-апп на весь экран

    console.log('Mini App запущен');

    document.getElementById("shareButton").addEventListener("click", () => {
      console.log('Кнопка нажата — вызываем shareToStory');

      const status = document.getElementById("status");
      status.textContent = "Открываем редактор...";

      try {
        tg.shareToStory({
          media_url: "https://iigiyuuui.github.io/Screenshot_10.jpg", // ← ТВОЯ ССЫЛКА НА КАРТИНКУ ИЗ GITHUB
          text: "Просто тест репоста в историю! 🔥", // До 200 символов (2048 для Premium)
          // widget_link: { // Только Premium
          //   url: "https://t.me/твойбот",
          //   name: "Мой мини-апп"
          // }
        });

        status.textContent = "Редактор открыт! Опубликуй историю или вернись назад.";
        console.log('shareToStory успешно вызван');
      } catch (error) {
        status.textContent = "Ошибка: " + (error.message || "неизвестная");
        console.error("Ошибка shareToStory:", error);
      }
    });
  </script>
</body>
</html>
