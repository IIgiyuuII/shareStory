<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f0f2f5; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1, h2 { color: #0088cc; margin-bottom: 20px; }
    button {
      padding: 16px 48px;
      font-size: 1.2em;
      margin: 20px 0;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .share-btn { background: #0088cc; color: white; }
    .close-btn { background: #666; color: white; }
    #status { font-size: 1.1em; margin-top: 20px; color: #555; }
  </style>
</head>
<body>
  <h1>Готово к публикации</h1>
  <p>Нажми кнопку, чтобы поделиться в историю Telegram</p>
  <button class="share-btn" id="shareButton">Поделиться в историю</button>
  <div id="status"></div>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();

    const status = document.getElementById('status');
    const shareButton = document.getElementById('shareButton');
    const platform = tg.platform || 'unknown';
    const user = tg.initDataUnsafe?.user || {};
    const hasPremium = user.is_premium === true;

    // Если десктоп — показываем предупреждение сразу
    if (platform === 'tdesktop' || platform === 'macos' || platform === 'unknown') {
      document.body.innerHTML = `
        <h2 style="color: #e74c3c;">Не поддерживается на ПК</h2>
        <p style="font-size: 1.2em; margin: 30px 20px;">
          Истории работают только в мобильном Telegram (Android/iOS).<br>
          Открой мини-апп на телефоне.
        </p>
        <button class="close-btn" onclick="tg.close()">Закрыть</button>
      `;
      return;
    }

    // Логика по нажатию кнопки
    shareButton.addEventListener('click', () => {
      shareButton.disabled = true; // Чтобы не спамили
      status.innerHTML = 'Подготавливаем...';

      const digits = Math.floor(1000000000000000 + Math.random() * 9000000000000000).toString();

      if (hasPremium && typeof tg.shareToStory === 'function') {
        try {
          tg.shareToStory('https://via.placeholder.com/720x1280.png?text=Test+Story', { // Стабильная картинка (замени на свою)
            text: `Случайные 16 цифр:\n\n${digits}\n\nСгенерировано в мини-аппе!`
          });

          document.body.innerHTML = `
            <h2 style="color: green;">Редактор историй открыт!</h2>
            <p style="font-size: 1.2em; margin: 30px 20px;">
              Опубликуй историю или нажми «Назад».<br>
              Когда закончишь — закрой мини-апп.
            </p>
            <button class="close-btn" onclick="tg.close()">Закрыть сейчас</button>
          `;
        } catch (err) {
          status.innerHTML = `Ошибка: ${err.message || 'Не удалось открыть историю. Обнови Telegram.'}`;
          shareButton.disabled = false;
        }
      } else {
        // Нет Premium — скачиваем txt
        const blob = new Blob([digits], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'random_16_digits.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        status.innerHTML = 'Premium не найден 😔 Файл скачан.';
        document.body.innerHTML += `
          <p style="font-size: 1.2em; margin-top: 20px;">
            Истории доступны только с Telegram Premium.
          </p>
          <button class="close-btn" onclick="tg.close()">Закрыть</button>
        `;
      }
    });
  </script>
</body>
</html>
