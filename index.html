<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init({ defaults: { displaySize: 45 } });</script>

  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f0f2f5; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 { color: #0088cc; }
    button {
      padding: 18px 60px;
      font-size: 1.3em;
      margin: 30px 0;
      border: none;
      border-radius: 16px;
      background: #0088cc;
      color: white;
    }
    #status { font-size: 1.1em; margin: 20px; color: #333; white-space: pre-wrap; word-break: break-all; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Тест shareToStory с скрином</h1>
  <button id="shareButton">Поделиться в историю</button>
  <div id="status">Ждём нажатия... (смотри Eruda Console после клика)</div>

  <script>
    console.log('[START] Скрипт загружен');

    function init() {
      const tg = Telegram.WebApp;
      tg.ready();
      tg.expand();
      console.log('[INIT] Telegram ready + expand');

      const status = document.getElementById('status');
      const btn = document.getElementById('shareButton');

      if (!btn) {
        status.textContent = 'Ошибка: кнопка не найдена';
        console.error('Кнопка не найдена');
        return;
      }

      console.log('[INIT] Кнопка найдена');

      btn.addEventListener('click', () => {
        console.log('[CLICK] Кнопка нажата');
        status.textContent = 'Клик сработал → генерируем скрин...';

        const digits = Math.floor(1000000000000000 + Math.random() * 9000000000000000).toString();

        const platform = tg.platform || 'unknown';
        if (platform.includes('desktop') || platform === 'tdesktop' || platform === 'macos') {
          status.textContent += '\nПК: истории не поддерживаются';
          console.warn('ПК платформа');
          return;
        }

        if (typeof tg.shareToStory !== 'function') {
          status.textContent += '\nМетод shareToStory отсутствует';
          console.warn('Нет shareToStory');
          return;
        }

        // Генерируем "скрин" на canvas (как в @kts_bingo_bot — простой тест с текстом)
        console.log('[CANVAS] Генерируем изображение на canvas');
        const canvas = document.createElement('canvas');
        canvas.width = 720;  // Вертикальный размер для историй
        canvas.height = 1280;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f0f2f5';  // Фон как в мини-аппе
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0088cc';
        ctx.font = 'bold 60px sans-serif';
        ctx.fillText('Тест скрин из мини-аппа', 50, 200);
        ctx.font = '40px sans-serif';
        ctx.fillText(digits, 50, 400);
        ctx.fillText('Дата: 02.02.2026', 50, 600);

        const dataUrl = canvas.toDataURL('image/png');
        console.log('[CANVAS] Data URL готов: ' + dataUrl.substring(0, 50) + '...');

        console.log('[CALL] Вызываем shareToStory с data:URL скрина');

        try {
          tg.shareToStory(dataUrl, {
            text: `Скрин из мини-аппа\nЦифры: ${digits}\nТест как в @kts_bingo_bot`
          });
          status.textContent += '\nВызов прошёл → редактор должен открыться со скрином';
          console.log('[SUCCESS] shareToStory вызван без исключения');
        } catch (err) {
          status.textContent += '\nОшибка: ' + (err.message || 'неизвестно');
          console.error('[ERROR] shareToStory:', err);
        }
      });

      status.textContent = 'Готово к тесту\n(открой Eruda → Console)';
      console.log('[INIT] Всё настроено');
    }

    init();
  </script>
</body>
</html>
