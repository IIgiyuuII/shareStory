<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Eruda для мобильной консоли -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init({ defaults: { displaySize: 45 } }); // чуть больше, чтобы удобно</script>

  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f0f2f5; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 { color: #0088cc; }
    button {
      padding: 18px 60px;
      font-size: 1.3em;
      margin: 30px 0;
      border: none;
      border-radius: 16px;
      background: #0088cc;
      color: white;
      cursor: pointer;
    }
    #status { font-size: 1.1em; margin: 20px; color: #333; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Тест кнопки</h1>
  <button id="shareButton">Поделиться в историю</button>
  <div id="status">Ждём нажатия... (открой Eruda → Console)</div>

  <script>
    console.log('Скрипт запущен успешно');

    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();
    console.log('Telegram.WebApp ready + expand вызваны');
    console.log('Платформа:', tg.platform);
    console.log('Premium:', tg.initDataUnsafe?.user?.is_premium);

    const status = document.getElementById('status');
    const btn = document.getElementById('shareButton');

    if (!btn) {
      status.innerHTML = 'Кнопка НЕ найдена по id="shareButton" !';
      console.error('Кнопка НЕ найдена');
      alert('Кнопка не найдена — проверь id');
      return;
    }

    console.log('Кнопка найдена, привязываем click');

    btn.addEventListener('click', function(e) {
      console.log('Кнопка нажата! Событие click сработало');
      status.innerHTML = 'Кнопка нажата!\nПопытка открыть историю...';

      try {
        const digits = Math.floor(1000000000000000 + Math.random() * 9000000000000000).toString();
        console.log('Сгенерированы цифры:', digits);

        if (tg.platform.includes('desktop') || tg.platform === 'tdesktop') {
          status.innerHTML += '\nПК — истории не поддерживаются';
          alert('На ПК истории не работают');
          return;
        }

        if (typeof tg.shareToStory !== 'function') {
          console.warn('shareToStory отсутствует');
          status.innerHTML += '\nМетод shareToStory недоступен';
          alert('Метод shareToStory не найден');
          return;
        }

        console.log('Вызываем shareToStory...');
        tg.shareToStory(
          'https://via.placeholder.com/720x1280/0088cc/ffffff?text=Test+Story+2026',
          { text: `Цифры: ${digits}\nТест из мини-аппа` }
        );

        status.innerHTML += '\nВызов прошёл (без видимой ошибки)\n→ Редактор должен появиться через 1–3 сек';
        console.log('shareToStory вызван без исключения');
      } catch (err) {
        console.error('Ошибка в shareToStory:', err);
        status.innerHTML += '\nОшибка: ' + (err.message || 'неизвестно');
        alert('Ошибка: ' + (err.message || 'проверь консоль'));
      }
    });

    console.log('Обработчик click привязан');
  </script>
</body>
</html>
