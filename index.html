<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px; 
      background: #f0f2f5; 
      margin: 0;
    }
    h1, h2 { color: #0088cc; }
    .message { font-size: 1.2em; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Подготовка...</h1>
  <div class="message" id="status">Проверяем...</div>

  <script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

 const user = tg.initDataUnsafe?.user || {};
const hasPremium = user.is_premium === true;  // строго === true, undefined → false

// Для отладки оставь временно:
status.innerHTML += `<p>is_premium сырое значение: ${user.is_premium} (тип: ${typeof user.is_premium})</p>`;

// Проверка платформы (на всякий)
if (tg.platform === 'tdesktop' || tg.platform === 'macos') {
  // ... сообщение о десктопе, как раньше
  return;
}

if (hasPremium && typeof tg.shareToStory === 'function') {
  try {
    const mediaUrl = "https://picsum.photos/720/1280"; // или твоя картинка

    tg.shareToStory(mediaUrl, {
      text: `Случайные 16 цифр:\n\n${digits}\n\nСгенерировано на сайте!`
    });

    document.body.innerHTML = `
      <h2 style="color:green">Редактор историй должен открыться!</h2>
      <p style="font-size:1.3em; margin:30px 20px;">
        Если ничего не появилось — обнови Telegram до последней версии.<br>
        Опубликуй или нажми «Назад», потом можешь закрыть мини-апп.
      </p>
      <button onclick="tg.close()" style="padding:14px 40px; background:#0088cc; color:white; border:none; border-radius:12px;">
        Закрыть мини-апп
      </button>
    `;
  } catch (err) {
    status.innerHTML = `Ошибка при вызове shareToStory: ${err.message || err}`;
  }
} else {
  // Нет Premium (или флаг не пришёл) → скачиваем txt
  // ... твой код скачивания файла
  document.body.innerHTML = `
    <h2>Premium не обнаружен 😔 (или флаг не пришёл от Telegram)</h2>
    <p>Файл random_16_digits.txt скачан.</p>
    <p>Если у тебя есть Premium — попробуй написать боту /start ещё раз, потом перезапусти мини-апп.</p>
    <button onclick="tg.close()" style="padding:12px 30px; background:#666; color:white; border:none; border-radius:10px; margin-top:20px;">
      Закрыть
    </button>
  `;
  }
</script>
</body>
</html>
