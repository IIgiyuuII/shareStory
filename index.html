<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Eruda для отладки (удали после теста) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 { color: #0088cc; margin-bottom: 30px; }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-bottom: 40px;
    }
    button {
      padding: 16px 60px;
      font-size: 1.3em;
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    button:hover { background: #006699; }
    #status {
      margin-top: 30px;
      font-size: 1.1em;
      color: #555;
      max-width: 90%;
    }
  </style>
</head>
<body>

  <h1>Поделиться в историю</h1>

  <!-- Показываем картинку из репозитория -->
  <img src="photo/Screenshot_10.jpg" alt="Фон для истории">

  <button id="shareButton">Поделиться в историю</button>

  <div id="status">Нажмите кнопку</div>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();

    console.log('Мини-апп запущен');

    const shareButton = document.getElementById("shareButton");
    const status = document.getElementById("status");

    shareButton.addEventListener("click", () => {
      console.log('Кнопка нажата → shareToStory');

      status.textContent = "Открываем редактор...";

      try {
        tg.shareToStory({
          media_url: "https://raw.githubusercontent.com/IIgiyuuII/shareStory/main/photo/Screenshot_10.jpg",
          text: "Тест репоста в историю! 🔥"
        });

        status.textContent = "Редактор открыт! Опубликуй или вернись.";
        console.log('shareToStory вызван успешно');
      } catch (error) {
        status.textContent = "Ошибка: " + (error.message || "неизвестная");
        console.error("Ошибка shareToStory:", error);
      }
    });
  </script>
</body>
</html>
