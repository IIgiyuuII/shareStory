<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px; 
      background: #f0f2f5; 
      margin: 0;
    }
    h1, h2 { color: #0088cc; }
    .message { font-size: 1.2em; margin-top: 30px; }
    pre { text-align: left; background: white; padding: 15px; border-radius: 8px; font-size: 0.95em; overflow: auto; max-width: 100%; }
  </style>
</head>
<body>
  <h1>Подготовка...</h1>
  <div class="message" id="status">Проверяем...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Генерируем цифры сразу
    const digits = Math.floor(1000000000000000 + Math.random() * 9000000000000000).toString();

    const status = document.getElementById('status');
    const user = tg.initDataUnsafe?.user || {};
    const hasPremium = user.is_premium === true; // undefined/false → нет

    // Отладка
    status.innerHTML = `
      <p>Платформа: ${tg.platform}</p>
      <p>is_premium сырое: ${user.is_premium} (тип: ${typeof user.is_premium})</p>
      <p>hasPremium: ${hasPremium}</p>
    `;

    if (tg.platform === 'tdesktop' || tg.platform === 'macos') {
      status.innerHTML += '<p style="color:red">Работает только в мобильном Telegram (Android/iOS)</p>';
      return;
    }

    if (hasPremium && typeof tg.shareToStory === 'function') {
      try {
        const mediaUrl = "https://picsum.photos/720/1280"; // вертикальная картинка

        tg.shareToStory(mediaUrl, {
          text: `Случайные 16 цифр:\n\n${digits}\n\nСгенерировано на моём сайте!`
        });

        document.body.innerHTML = `
          <h2 style="color:green">Редактор историй открыт!</h2>
          <p style="font-size:1.3em; margin:30px 20px;">
            Опубликуй историю или нажми «Назад».<br>
            Когда закончишь — закрой мини-апп (кнопка сверху или свайп).
          </p>
          <button onclick="Telegram.WebApp.close()" style="padding:14px 40px; background:#0088cc; color:white; border:none; border-radius:12px; font-size:1.1em;">
            Закрыть сейчас
          </button>
        `;
      } catch (err) {
        status.innerHTML += `<p style="color:red">Ошибка shareToStory: ${err.message || err}</p>`;
      }
    } else {
      // Нет Premium или флаг не пришёл → скачиваем txt
      const blob = new Blob([digits], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "random_16_digits.txt";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      document.body.innerHTML = `
        <h2>Premium не обнаружен 😔</h2>
        <p>Файл с 16 случайными цифрами скачан на устройство.</p>
        <p style="margin-top:20px;">(Это нормальное поведение без Premium — истории доступны только подписчикам)</p>
        <button onclick="Telegram.WebApp.close()" style="padding:12px 30px; background:#666; color:white; border:none; border-radius:10px; margin-top:20px;">
          Закрыть
        </button>
      `;
    }
  </script>
</body>
</html>
