<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init({ defaults: { displaySize: 45 } });</script>

  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 40px 20px; background: #f0f2f5; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    h1 { color: #0088cc; margin-bottom: 40px; }
    button { padding: 20px 80px; font-size: 1.4em; margin: 40px 0; border: none; border-radius: 20px; background: #0088cc; color: white; cursor: pointer; }
    #status { font-size: 1.2em; margin: 30px; color: #333; white-space: pre-wrap; word-break: break-all; background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #ccc; max-width: 90%; }
  </style>
</head>
<body>
  <h1>Поделиться в историю</h1>
  <button id="shareBtn">Открыть редактор</button>
  <div id="status">Нажмите кнопку</div>

  <script>
    console.log('[START] Скрипт запущен');

    function init() {
      const tg = Telegram.WebApp;
      tg.ready();
      tg.expand();
      console.log('[INIT] WebApp готов');

      const status = document.getElementById('status');
      const btn = document.getElementById('shareBtn');

      if (!btn) {
        status.textContent = 'Кнопка не найдена';
        return;
      }

      btn.addEventListener('click', async () => {
        console.log('[CLICK] Кнопка нажата');
        status.textContent = 'Генерируем изображение...';

        const canvas = document.createElement('canvas');
        canvas.width = 720;
        canvas.height = 1280;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f0f2f5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0088cc';
        ctx.font = 'bold 60px sans-serif';
        ctx.fillText('Тест', 100, 300);

        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        console.log('[CANVAS] Blob готов');

        status.textContent += '\nЗагружаем на freeimage.host...';

        const formData = new FormData();
        formData.append('source', blob, 'test.png');
        formData.append('action', 'upload');
        formData.append('format', 'json');

        try {
          const res = await fetch('https://freeimage.host/api/1/upload', {
            method: 'POST',
            body: formData
          });

          if (!res.ok) throw new Error('HTTP ' + res.status);

          const json = await res.json();
          console.log('[UPLOAD] Ответ:', json);

          if (json.status !== 'success' || !json.image?.url) {
            throw new Error(json.error?.message || 'Нет URL');
          }

          const url = json.image.url;
          console.log('[UPLOAD] URL:', url);

          status.textContent += '\nЗагружено! Открываем редактор...';

          tg.shareToStory(url, { text: 'Тест из мини-аппа' });
          status.textContent += '\nРедактор должен открыться';
          console.log('[SUCCESS] Вызов shareToStory');
        } catch (err) {
          console.error('[ERROR]', err);
          status.textContent += '\nОшибка: ' + (err.message || 'неизвестно');
        }
      });

      status.textContent = 'Готово';
    }

    init();
  </script>
</body>
</html>
