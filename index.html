<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f0f2f5; 
      margin: 0;
      min-height: 100vh;
    }
    h1, h2 { color: #0088cc; }
    button {
      padding: 14px 40px;
      font-size: 1.1em;
      margin: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .blue { background: #0088cc; color: white; }
    .gray { background: #ccc; color: black; }
  </style>
</head>
<body>
  <h1>Подготовка...</h1>
  <div id="status" style="font-size:1.1em; margin:20px 0;">Проверяем Telegram...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.body.innerHTML = '<h1>Тест — код дошёл сюда!</h1>';
  </script>
</body>
</html>
