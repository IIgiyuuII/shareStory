<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поделиться в историю</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f0f2f5; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1, h2 { color: #0088cc; margin-bottom: 20px; }
    button {
      padding: 16px 48px;
      font-size: 1.2em;
      margin: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .blue { background: #0088cc; color: white; }
    .gray { background: #777; color: white; }
  </style>
</head>
<body>

  <h1>Тестовый генератор</h1>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Генерируем сразу
    const digits = Math.floor(1000000000000000 + Math.random() * 9000000000000000).toString();

    const user = tg.initDataUnsafe?.user || {};
    const hasPremium = user.is_premium === true;

    if (hasPremium && typeof tg.shareToStory === 'function') {
      try {
        tg.shareToStory('https://picsum.photos/720/1280', {
          text: `Случайные 16 цифр:\n\n${digits}\n\nСгенерировано здесь → t.me/твойбот`
        });

        document.body.innerHTML = `
          <h2 style="color: green;">Редактор историй открыт!</h2>
          <p style="font-size: 1.2em; margin: 24px 16px;">
            Опубликуй историю или нажми «Назад».<br>
            Потом можешь закрыть это окно.
          </p>
          <button class="blue" onclick="Telegram.WebApp.close()">Закрыть</button>
        `;
      } catch (err) {
        // Если даже с Premium что-то пошло не так
        fallbackDownload();
      }
    } else {
      fallbackDownload();
    }

    function fallbackDownload() {
      const blob = new Blob([digits], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'random_16_digits.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.body.innerHTML = `
        <h2>Premium не обнаружен</h2>
        <p style="font-size: 1.2em; margin: 24px 16px;">
          Файл <strong>random_16_digits.txt</strong> скачан на устройство.<br>
          Публикация в истории доступна только с Telegram Premium.
        </p>
        <button class="gray" onclick="Telegram.WebApp.close()">Закрыть</button>
      `;
    }
  </script>

</body>
</html>
